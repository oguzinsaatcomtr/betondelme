<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oğuz inşaat Gaziantep</title>
  <meta name="description" content="Profesyonel beton delme ve kesme hizmetleri sunan firmamız, inşaat projeleriniz için hızlı ve güvenilir çözümler sunar. Beton delme, kesme ve kırma işlemlerinde en son teknolojiyi kullanarak uygun fiyatlarla hizmet veriyoruz. Daha fazla bilgi ve fiyat teklifi almak için hemen bizimle iletişime geçin!" />
  <link rel="canonical" href="https://oguzinsaat.com.tr/" />
  <link rel="alternate" hreflang="tr" href="https://oguzinsaat.com.tr/tr/" />
  <link rel="alternate" hreflang="x-default" href="https://oguzinsaat.com.tr/tr/" />
  <script>
(function() {
  var available = ["tr"];
  var fallbackLang = "tr";
  var defaultLang = "tr";
  var browserLangs = [];
  if (navigator.languages && navigator.languages.length) {
    navigator.languages.forEach(function(l) {
      var code = (l.split('-')[0] || '').toLowerCase();
      if (code && browserLangs.indexOf(code) === -1) browserLangs.push(code);
    });
  }
  if (!browserLangs.length && navigator.language) {
    browserLangs.push((navigator.language.split('-')[0] || defaultLang).toLowerCase());
  }
  var chosen = null;
  for (var i = 0; i < browserLangs.length; i++) {
    if (available.indexOf(browserLangs[i]) !== -1) {
      chosen = browserLangs[i];
      break;
    }
  }
  if (chosen === null) {
    chosen = fallbackLang;
  }
  var target = '/' + chosen + '/' + (location.search || '') + (location.hash || '');
  location.replace(target);
})();
  </script>
</head>
<body>
  <p>Oğuz inşaat Gaziantep</p>
  <noscript><p>Dil seçin: <a href="/tr/">TR</a></p></noscript>
</body>
</html>
